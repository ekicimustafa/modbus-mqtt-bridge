services:
  modbus-mqtt-bridge:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    # For RTU (serial port) access, uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      - mqtt

  # Optional: local Mosquitto broker for testing (anonymous access, port 1883)
  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
