[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "modbus-mqtt-bridge"
version = "0.1.0"
description = "Read Modbus TCP/RTU devices and publish readings to an MQTT broker"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mustafa Ekici", email = "mustafaekici78@gmail.com" }]
keywords = ["modbus", "mqtt", "iot", "industrial", "scada", "plc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.6,<4.0",
    "aiomqtt>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
modbus-mqtt-bridge = "modbus_mqtt_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/ekicimustafa/modbus-mqtt-bridge"
Issues   = "https://github.com/ekicimustafa/modbus-mqtt-bridge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["modbus_mqtt_bridge*"]
